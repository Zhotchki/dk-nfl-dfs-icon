name: NFL public board collection
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['nfl-picks/collector/collect.py', '.github/workflows/nfl-board.yml']
permissions:
  contents: write
concurrency:
  group: nfl-public-board
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public NFL lines
        run: python nfl-picks/collector/collect.py
      - name: Save board snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nfl-picks/collector/board.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public NFL board lines'
          git pull --rebase origin main
          git push origin HEAD:main
