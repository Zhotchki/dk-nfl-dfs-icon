<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NFL DFS">
<title>NFL DFS Command Center</title><link rel="apple-touch-icon" sizes="180x180" href="./icon.png?v=1360">
<link rel="icon" type="image/png" href="./icon.png?v=1360"><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#0b1220;--card:#111827;--muted:#94a3b8;--text:#f8fafc;--blue:#3b82f6;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(16px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin-bottom:8px}header img{width:44px;height:44px;border-radius:11px}h1{font-size:21px;margin:0}.status{font-size:12px;color:var(--muted);margin:4px 0 14px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#162033;color:var(--text);font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button.active{background:var(--blue)}.card{background:var(--card);border:1px solid #253047;border-radius:14px;padding:12px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.meta,.why{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.m{background:#0d1627;border-radius:8px;padding:7px;text-align:center}.m b,.m span{display:block}.m span{font-size:10px;color:var(--muted)}.hidden{display:none}.badge{font-size:10px;background:#243047;padding:3px 6px;border-radius:999px}.loading{text-align:center;color:var(--muted);padding:40px 8px}
</style></head><body>
<header><img src="./icon.png"><div><h1>NFL DFS Command Center <span id="ver" style="font-size:12px;color:#94a3b8"></span></h1><div id="status" class="status">Loading DK Lineups…</div><button onclick="load()" style="width:auto;padding:6px 10px;font-size:12px">Retry</button></div></header>
<div class="tabs"><button id="pTab" class="active" onclick="tab('players')">Players</button><button id="lTab" onclick="tab('lineups')">Lineups</button></div>
<div class="controls"><button onclick="action('refreshall')">Refresh All</button><button onclick="action('injuries')">Refresh Injuries</button><button onclick="action('generate')" style="grid-column:1/-1;background:var(--green);color:#06120a">Generate Lineups</button></div>
<div id="filters" class="controls"><select id="mode" onchange="load()"><option>Single Entry GPP</option><option>Large-Field GPP</option><option>Cash</option></select><select id="pos" onchange="renderPlayers()"><option value="ALL">All Positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>DST</option></select><select id="team" onchange="renderPlayers()"><option value="ALL">All Teams</option></select><select id="day" onchange="renderPlayers()"><option value="ALL">All Days</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option><option>Monday</option></select><select id="active" onchange="renderPlayers()"><option value="ALL">All Active</option><option value="NOT_STARTED">Not Started</option></select><select id="sort" onchange="renderPlayers()"><option value="score">DFS Score</option><option value="proj">Projection</option><option value="ceil">Ceiling</option><option value="value">Value</option><option value="boom">Boom</option></select></div>
<div id="players"><div class="loading">Loading player data…</div></div><div id="lineups" class="hidden"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzFXNrNz3sZ6WzbLZEzVTxvglszPaHUndCM_4p5YTnmRzOyIwqcYMmsafkYzEGA6Wlz/exec';let DATA={players:[],lineups:[],teams:[],tags:[]},seq=0;
function callApi(params,label){const n=++seq,cb='dfsMobile'+n;setStatus(label||'Loading DK Lineups…');const s=document.createElement('script');let done=false;const timer=setTimeout(()=>{if(done)return;done=true;cleanup();setStatus('API timed out — tap Retry')},45000);function cleanup(){clearTimeout(timer);try{s.remove()}catch(e){}try{delete window[cb]}catch(e){}}window[cb]=r=>{if(done)return;done=true;cleanup();if(!r||r.ok===false){setStatus('Error: '+((r&&r.error)||'Unknown API error'));return}const d=r.data||r;DATA=d||DATA;document.getElementById('ver').textContent=d.version?'• '+d.version:'';fillTeams();renderPlayers();renderLineups();setStatus('Updated '+new Date(d.updated).toLocaleTimeString()+' • '+d.mode)};s.onerror=()=>{if(done)return;done=true;cleanup();setStatus('API request blocked — use secure app');showFallback()};const qs=Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');s.src=API+'?api=mobile&callback='+encodeURIComponent(cb)+'&cb='+Date.now()+'&'+qs;document.body.appendChild(s)}
function showFallback(){if(document.getElementById('secureFallback'))return;const a=document.createElement('a');a.id='secureFallback';a.href=API;a.textContent='Open Secure DFS App';a.style='display:block;text-align:center;margin:12px 0;padding:13px;border-radius:10px;background:#3b82f6;color:white;text-decoration:none;font-weight:700';document.querySelector('header').insertAdjacentElement('afterend',a)}
function load(){callApi({mode:v('mode')},'Loading DK Lineups…')}
function action(a){const labels={refreshall:'Refreshing all DFS data…',injuries:'Refreshing injuries…',generate:'Generating lineups…'};callApi({action:a,mode:v('mode'),day:v('day')},labels[a])}
function fillTeams(){const e=document.getElementById('team'),old=e.value;e.innerHTML='<option value="ALL">All Teams</option>'+DATA.teams.map(x=>'<option>'+esc(x)+'</option>').join('');e.value=DATA.teams.includes(old)?old:'ALL'}
function renderPlayers(){let p=[...(DATA.players||[])],pos=v('pos'),team=v('team'),day=v('day'),active=v('active');if(pos!=='ALL')p=p.filter(x=>x.pos===pos);if(team!=='ALL')p=p.filter(x=>x.team===team);if(day!=='ALL')p=p.filter(x=>{const d=new Date(x.start);return isFinite(d.getTime())&&new Intl.DateTimeFormat('en-US',{weekday:'long',timeZone:'America/Chicago'}).format(d)===day});if(active==='NOT_STARTED')p=p.filter(x=>{const d=new Date(x.start);return isFinite(d.getTime())&&d.getTime()>Date.now()});p.sort((a,b)=>(Number(b[v('sort')])||0)-(Number(a[v('sort')])||0));document.getElementById('players').innerHTML=p.slice(0,100).map(x=>'<div class="card"><div class="row"><div><div class="name">'+esc(x.name)+'</div><div class="meta">'+esc(x.pos)+' • '+esc(x.team)+' vs '+esc(x.opp)+' • $'+num(x.salary,0)+'</div></div><span class="badge">'+esc(x.grade||'')+'</span></div><div class="metrics"><div class="m"><b>'+num(x.proj,1)+'</b><span>Proj</span></div><div class="m"><b>'+num(x.ceil,1)+'</b><span>Ceiling</span></div><div class="m"><b>'+num(x.value,2)+'x</b><span>Value</span></div><div class="m"><b>'+pct(x.boom)+'</b><span>Boom</span></div></div><div class="why">'+esc(x.why||'')+'</div></div>').join('')||'<div class="loading">No matching players.</div>'}
function renderLineups(){document.getElementById('lineups').innerHTML=(DATA.lineups||[]).map(l=>'<div class="card"><div class="row"><div class="name">Lineup #'+esc(l.rank)+'</div><div class="meta">$'+num(l.salary,0)+' • '+num(l.proj,1)+' proj</div></div><div class="meta" style="margin-top:8px">'+l.players.map(esc).join(' • ')+'</div></div>').join('')||'<div class="loading">No generated lineups.</div>'}
function tab(n){document.getElementById('players').classList.toggle('hidden',n!=='players');document.getElementById('lineups').classList.toggle('hidden',n!=='lineups');document.getElementById('filters').classList.toggle('hidden',n!=='players');document.getElementById('pTab').classList.toggle('active',n==='players');document.getElementById('lTab').classList.toggle('active',n==='lineups')}
function setStatus(x){document.getElementById('status').textContent=x}function v(i){return document.getElementById(i).value}function num(x,d){const n=Number(x);return isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):'-'}function pct(x){const n=Number(x);return isFinite(n)?(n*100).toFixed(0)+'%':'-'}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
load();
</script></body></html>
